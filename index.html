function viewTrash(){const roots=[...N.values()].filter(x=>x.delRoot===x.id).sort((a,b)=>b.deleted-a.deleted);
 return `<div class="wrap set"><div class="topbar">${topBtn('back',ICON.back,'')}<span></span></div><h1 class="tt">Корзина</h1>
 ${roots.length?roots.map(r=>`<div class="tpl"><b>${esc(r.mark)} ${esc(nodeTitle(r))}</b><p>${r.type==='col'?esc(subText(r)):r.type==='note'?'Заметка':'Фото'} · удалено ${fmtDate(r.deleted)}</p><div class="row"><button class="pill c2" data-act="restore" data-id="${r.id}">Вернуть</button><button class="pill ghost" data-act="purge" data-id="${r.id}">Удалить навсегда</button></div></div>`).join('')+`<div class="row" style="margin-top:16px"><button class="btn soft wide" data-act="emptytrash">Очистить корзину</button></div>`:'<div class="empty"><b>Корзина пуста</b></div>'}</div>`}
let BK=null;
function viewBackup(){return `<div class="wrap set"><div class="topbar">${topBtn('back',ICON.back,'')}<span></span></div><h1 class="tt">Резервная копия</h1>
 <div class="note">Приложение собирает один файл со всеми записями и фото. Сохрани его в «Файлы» или iCloud Drive. На новом телефоне открой приложение и выбери этот файл в «Восстановить».</div>
 <div id="bkbox"><button class="btn pink wide" data-act="mkbk">Подготовить копию</button></div>
 <div class="lbl" style="margin-top:28px">Восстановление</div><button class="btn soft wide" data-act="restorebk">Восстановить из файла</button>
 <div class="hint" style="text-align:left;margin-top:10px">Восстановление заменяет всё, что сейчас есть в приложении.</div>
 <div class="lbl" style="margin-top:28px">Последняя копия</div><div>${SET.lastBackup?fmtDate(SET.lastBackup):'ещё не делала'}</div></div>`}
async function makeBackup(){const zip=new JSZip();const box=$('#bkbox');let i=0;const all=[...N.values()],meta=[];
 for(const n of all){const o=Object.assign({},n);for(const k of['cover','thumb','avatar'])if(n[k]){zip.file(`m/${n.id}.${k}`,n[k],{binary:true,compression:'STORE'});o[k]=1}
  for(const k of['src','view'])if(n[k]){const b=await getBlob(n[k]);if(b)zip.file(`m/${n.id}.${k}`,b,{binary:true,compression:'STORE'})}
  for(const ch of(n.chats||[]))if(ch.img){const b=await getBlob(ch.img);if(b)zip.file('c/'+ch.img,b,{binary:true,compression:'STORE'})}
  meta.push(o);if(++i%10===0&&box)box.innerHTML=`<div class="hint">Собираю… ${i} из ${all.length}</div>`}
 zip.file('data.json',JSON.stringify({v:1,app:'leads',exported:Date.now(),nodes:meta,settings:{views:SET.views,sorts:SET.sorts,view:SET.view,remW:SET.remW,remH:SET.remH,lastCur:SET.lastCur,cities:SET.cities,dailyN:SET.dailyN,sleepAfter:SET.sleepAfter,trips:SET.trips,leadH:SET.leadH,boards:SET.boards,board:SET.board,wlog:SET.wlog,mtpl:SET.mtpl,ctpl:SET.ctpl}}));
 return zip.generateAsync({type:'blob',compression:'STORE'})}
async function importBackup(file){const zip=await JSZip.loadAsync(file);const f=zip.file('data.json');if(!f)throw new Error('no data');const d=JSON.parse(await f.async('string'));if(d.app!=='leads')throw new Error('bad');
 const rd=async(p)=>{const z=zip.file(p);if(!z)return null;const b=await z.async('blob');return new Blob([b],{type:'image/jpeg'})};
 await dbClear('nodes');await dbClear('blobs');N.clear();dirty();PLAIN.clear();
 for(const o of d.nodes){if(o.cover===1)o.cover=await rd(`m/${o.id}.cover`);if(o.thumb===1)o.thumb=await rd(`m/${o.id}.thumb`);if(o.avatar===1)o.avatar=await rd(`m/${o.id}.avatar`);
  for(const k of['src','view'])if(o[k]){const b=await rd(`m/${o.id}.${k}`);if(b)await putBlob(o[k],b);else o[k]=''}
  for(const ch of(o.chats||[]))if(ch.img){const z=zip.file('c/'+ch.img);if(z){const b=await z.async('blob');await putBlob(ch.img,new Blob([b],{type:'image/jpeg'}))}}
  await dbPut('nodes',o);N.set(o.id,o)}
 const s=d.settings||{};SET.views=s.views||{};SET.sorts=s.sorts||{};SET.view=s.view||'list';if(s.remW)SET.remW=s.remW;if(s.remH)SET.remH=s.remH;if(s.lastCur)SET.lastCur=s.lastCur;if(s.cities)SET.cities=s.cities;if(s.dailyN)SET.dailyN=s.dailyN;if(s.sleepAfter)SET.sleepAfter=s.sleepAfter;if(s.trips)SET.trips=s.trips;for(const k of['boards','board','wlog','mtpl','ctpl','leadH'])if(s[k])SET[k]=s[k];saveSet();dirty()}

/* ===== PIN ===== */
let LOCKED=false;
const sha=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
function pinPad({title,sub='',cancel=false,forgot=false}){return new Promise(res=>{const el=document.createElement('div');el.className='lock';let v='';
 el.innerHTML=`<img src="lidy.png" alt=""><h2>${esc(title)}</h2><div class="hint" style="margin:-8px 0 12px">${esc(sub)}</div><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}<button class="nb" data-x="c">${cancel?'Отмена':''}</button><button data-d="0">0</button><button class="nb" data-x="b">⌫</button></div>
 ${forgot?'<button class="lk" id="fg">Забыла PIN?</button>':''}`;document.body.appendChild(el);const dots=[...el.querySelectorAll('.dots i')];
 const paint=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d!=null){if(v.length<4){v+=b.dataset.d;paint();if(v.length===4)setTimeout(()=>{res({v,el})},120)}}
  else if(b.dataset.x==='b'){v=v.slice(0,-1);paint()}else if(b.dataset.x==='c'&&cancel){el.remove();res(null)}});
 const fg=el.querySelector('#fg');if(fg)fg.onclick=()=>forgotPin();
 el.reset=()=>{v='';paint();const d=el.querySelector('.dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}})}
function forgotPin(){const el=sheet(`<h3>Забыла PIN?</h3><p style="color:#55555e;margin:0 0 14px">PIN нельзя сбросить без потери данных, иначе он ничего бы не защищал. Можно стереть всё в приложении и вернуть записи из резервной копии (файл из «Файлов»).</p><button class="btn wide" id="wipe" style="background:#d6264a">Стереть всё и начать заново</button>`);el.style.zIndex=120;SHEET.bg.style.zIndex=119;
 el.querySelector('#wipe').onclick=async()=>{if(!confirm('Точно стереть все записи и фото на этом телефоне?'))return;await dbClear('nodes');await dbClear('blobs');SET={view:'list',views:{},sorts:{},pinHash:null,pinSalt:null,lastBackup:0,last:''};saveSet();location.hash='';location.reload()}}
async function unlock(){LOCKED=true;let bad=0;
 for(;;){const r=await pinPad({title:'Введи PIN',sub:'',forgot:true});if(await sha(SET.pinSalt+r.v)===SET.pinHash){document.querySelectorAll('.lock').forEach(x=>x.remove());LOCKED=false;return}
  bad++;r.el.reset&&r.el.reset();if(bad>=5){r.el.querySelector('.hint').textContent='Подожди 10 секунд…';await sleep(10000);bad=0;r.el.querySelector('.hint').textContent=''}
  r.el.remove();}}
async function setPin(){const a=await pinPad({title:'Придумай PIN',sub:'4 цифры',cancel:true});if(!a)return;a.el.remove();
 const b=await pinPad({title:'Повтори PIN',sub:'',cancel:true});if(!b)return;if(a.v!==b.v){b.el.remove();toast('PIN не совпал, попробуй ещё раз');return}b.el.remove();
 SET.pinSalt=uid()+uid();SET.pinHash=await sha(SET.pinSalt+a.v);saveSet();toast('PIN включён');render()}
function pinMenu(){const on=!!SET.pinHash;menuSheet('PIN-код',[{ic:'🔒',t:on?'Изменить PIN':'Включить PIN',fn:setPin},...(on?[{ic:'🔓',t:'Выключить PIN',red:1,fn:async()=>{const r=await pinPad({title:'Введи текущий PIN',cancel:true});if(!r)return;const ok=await sha(SET.pinSalt+r.v)===SET.pinHash;r.el.remove();if(ok){SET.pinHash=null;SET.pinSalt=null;saveSet();render();toast('PIN выключен')}else toast('Неверный PIN')}}]:[])])}

/* ===== drag & drop ===== */
let DR=null;let NOCLICK=0;
function moveGhost(x,y){if(DR&&DR.g){DR.g.style.left=x+'px';DR.g.style.top=y+'px'}}
function dropAt(x,y){const els=document.elementsFromPoint(x,y);for(const e of els){const d=e.closest&&e.closest('[data-drop]');if(d&&d.dataset.drop!==DR.id)return d}return null}
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t||e.target.closest('.mn')||DR||LOCKED)return;if(e.pointerType==='mouse'&&e.button!==0)return;
 const sx=e.clientX,sy=e.clientY,id=t.dataset.id;let started=false,moved=false,lx=sx,ly=sy,iv=null;
 const clean=()=>{clearTimeout(timer);clearInterval(iv);document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cx)};
 const end=()=>{if(DR){DR.g.remove();DR.el.classList.remove('dragging');document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));document.body.classList.remove('dragmode');DR=null}};
 const timer=setTimeout(()=>{started=true;const g=document.createElement('div');g.className='dragghost';g.textContent=nodeTitle(N.get(id));document.body.appendChild(g);DR={id,el:t,g};t.classList.add('dragging');document.body.classList.add('dragmode');moveGhost(sx,sy);navigator.vibrate&&navigator.vibrate(12);
  iv=setInterval(()=>{if(lx!=null){if(ly<110)scrollBy(0,-14);else if(ly>innerHeight-110)scrollBy(0,14)}},30)},e.pointerType==='mouse'?180:420);
 const mv=ev=>{lx=ev.clientX;ly=ev.clientY;if(!started){if(Math.hypot(lx-sx,ly-sy)>10)clean();return}if(Math.hypot(lx-sx,ly-sy)>14)moved=true;moveGhost(lx,ly);document.querySelectorAll('.over').forEach(o=>o.classList.remove('over'));const d=dropAt(lx,ly);if(d)d.classList.add('over')};
 const up=ev=>{const was=started;let tg=null;if(was)tg=dropAt(ev.clientX,ev.clientY);clean();end();if(was){NOCLICK=Date.now()+500;if(tg)moveNode(id,tg.dataset.drop);else if(!moved&&N.get(id))nodeMenu(N.get(id))}};
 const cx=()=>{clean();end()};
 document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cx)});
document.addEventListener('touchmove',e=>{if(DR)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-drag],.card,.it'))e.preventDefault()});

/* ===== global clicks ===== */
document.addEventListener('click',async e=>{
 if(Date.now()<NOCLICK){e.preventDefault();return}
 const g=e.target.closest('[data-go]');if(g&&!e.target.closest('[data-act]')){go(g.dataset.go);return}
 const a=e.target.closest('[data-act]');if(!a||LOCKED)return;const act=a.dataset.act,id=a.dataset.id;const n=id?N.get(id):null;
 switch(act){
  case'open':if(!n)return;go(routeOf(n));break;
  case'back':go(n?parentRoute(n):(['bk','t'].includes(parseHash().k)?'/s':'/'));break;
  case'imenu':case'nmenu':if(n)nodeMenu(n);break;
  case'search':searchScreen(id||null);break;
  case'view':{const k=parseHash().id||'root';SET.views[k]=(SET.views[k]||SET.view)==='list'?'grid':'list';saveSet();render();break}
  case'settings':go('/s');break;
  case'sort':sortSheet(parseHash().id);break;
  case'tpl':tplSheet(id);break;
  case'fab':fabMenu(id||null);break;
  case'bold':boldSmart();break;
  case'insdate':{const ed=$('#ed');ed.focus();document.execCommand('insertText',false,todayRu());break}
  case'instpl':{const tp=availTemplates(EDN.parent);if(!tp.length){const bk=pathOf(EDN.parent)[0];flushNote();tplSheet(bk?bk.id:EDN.parent);toast('Создай шаблон здесь. Он появится во всех коллекциях этой книжки');break}
   if(tp.length===1)insertTemplate(tp[0]);else menuSheet('Вставить шаблон',tp.map(t=>({ic:'📄',t:t.name,fn:()=>insertTemplate(t)})));break}
  case'recrop':recrop(n);break;
  case'zoomp':$('#pv').classList.toggle('big');break;
  case'share':{const b=await getBlob(n.mode==='square'&&n.view?n.view:n.src);if(!b)break;const f=new File([b],'foto-'+n.id+'.jpg',{type:'image/jpeg'});holdLock();
   if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(_){}}else{const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=f.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}break}
  case'pin':pinMenu();break;
  case'defview':SET.view=SET.view==='list'?'grid':'list';saveSet();render();break;
  case'restore':await restoreRoot(id);break;
  case'purge':if(await ask('Удалить навсегда?','Это нельзя отменить.','Удалить',true)){await purgeRoot(id);render()}break;
  case'emptytrash':if(await ask('Очистить корзину?','Всё в корзине удалится навсегда.','Очистить',true)){for(const x of[...N.values()].filter(x=>x.delRoot===x.id))await purgeRoot(x.id);render()}break;
  case'mkbk':{const box=$('#bkbox');box.innerHTML='<div class="hint">Собираю файл…</div>';try{const blob=await makeBackup();const d=new Date();const name='lidy-kopiya-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.zip';
   BK=new File([blob],name,{type:'application/zip'});box.innerHTML=`<div class="hint" style="margin-bottom:10px">Готово: ${(blob.size/1048576).toFixed(1)} МБ</div><button class="btn lime wide" data-act="savebk">Сохранить файл</button>`}catch(err){console.error(err);box.innerHTML='<div class="hint">Не получилось собрать копию</div><button class="btn pink wide" data-act="mkbk">Попробовать ещё раз</button>'}break}
  case'savebk':{holdLock();let ok=false;if(navigator.canShare&&navigator.canShare({files:[BK]})){try{await navigator.share({files:[BK]});ok=true}catch(_){}}
   else{const u=URL.createObjectURL(BK);const l=document.createElement('a');l.href=u;l.download=BK.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),5000);ok=true}
   if(ok){SET.lastBackup=Date.now();saveSet();toast('Копия сохранена')}break}
  case'restorebk':{const f=(await pickAny())[0];if(!f)break;if(!await ask('Восстановить из файла?','Всё, что сейчас в приложении, будет заменено данными из файла.','Восстановить',true))break;
   try{toast('Восстанавливаю…');await importBackup(f);toast('Готово');go('/')}catch(err){console.error(err);toast('Это не похоже на файл копии')}break}
  default:act2(act,a,id,n)
 }});
function pickAny(){return new Promise(res=>{holdLock();const i=document.createElement('input');i.type='file';i.accept='.zip,application/zip';i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res([...i.files]);setTimeout(()=>i.remove(),500)};i.addEventListener('cancel',()=>{res([]);i.remove()});i.click()})}

/* ===== lifecycle ===== */
let hiddenAt=0,alive=Date.now();
setInterval(()=>{alive=Date.now()},2000);
function lockNow(){if(!SET.pinHash||LOCKED)return;flushNote();document.querySelectorAll('.ovl').forEach(x=>x.remove());closeSheet();APP.innerHTML='';unlock().then(render)}
function maybeLock(){if(!SET.pinHash||LOCKED||Date.now()<LOCKUNTIL)return;const gap=Math.max(hiddenAt?Date.now()-hiddenAt:0,Date.now()-alive-3000);if(gap>(SET.lockAfter||0)+1500)lockNow()}
document.addEventListener('visibilitychange',()=>{const p=$('#priv');if(document.hidden){hiddenAt=Date.now();flushNote();if(SET.pinHash&&Date.now()>LOCKUNTIL)p.hidden=false}else{p.hidden=true;maybeLock();hiddenAt=0}});
window.addEventListener('pageshow',()=>{$('#priv').hidden=true;maybeLock()});
window.addEventListener('focus',()=>maybeLock());
window.addEventListener('pagehide',()=>{flushNote();hiddenAt=hiddenAt||Date.now()});
async function boot(){
 await openDB();const nodes=await dbAll('nodes');nodes.forEach(n=>N.set(n.id,n));dirty();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(!db)toast('Память браузера недоступна: записи не сохранятся после закрытия');
 if(SET.pinHash)await unlock();
 if(!location.hash&&SET.last){const m=SET.last.split('/');const nd=N.get(m[1]);if(nd&&!nd.deleted)location.hash='#/'+SET.last}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadRates().then(ok=>{if(ok&&parseHash().k==='b')render()})});
 render();loadRates().then(ok=>{if(ok&&['s','cal'].includes(parseHash().k))render()});
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();

</script></body></html>
