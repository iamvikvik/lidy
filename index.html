<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лиды</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лиды"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
:root{--ink:#0d0d0f;--mut:#8a8a94;--line:#ececf1;--soft:#f5f5f9;--blue:#8fd5f5;--lime:#b4f24f;--pink:#f9b6dc;--peach:#ffa77a;--lilac:#b9a6f4;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(130px + var(--sab))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.ibs{display:flex;gap:10px}
.ib{width:46px;height:46px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 18px rgba(30,20,60,.12);display:grid;place-items:center;padding:0}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px;stroke:#0d0d0f;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.dark{background:#0d0d0f}.ib.dark svg{stroke:#fff}
h1.tt{font-size:34px;line-height:1.04;letter-spacing:-1.3px;font-weight:800;margin:20px 0 10px;word-break:break-word}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:14px;font-weight:600;background:var(--blue);color:#0d0d0f;border:0;line-height:1.2}
.pill.c1{background:var(--blue)}.pill.c2{background:var(--lime)}.pill.c3{background:var(--pink)}.pill.c4{background:var(--peach)}.pill.c5{background:var(--lilac)}
.pill.ghost{background:var(--soft)}
.arrow{font-weight:800;color:#0d0d0f;opacity:.5;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.pill.drop,.crumbs .pill.over,.it.over .th,.card.over .th{outline:3px solid #0d0d0f;outline-offset:2px}
/* list & grid */
.list{margin-top:6px}
.it{display:flex;align-items:center;gap:14px;padding:9px 0;min-height:78px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.it+.it{border-top:1px solid var(--line)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-size:18px;font-weight:700;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .tx span{display:block;color:var(--mut);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{width:64px;height:64px;border-radius:16px;background:var(--soft);overflow:hidden;flex:none;position:relative}
.th>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.th.full>img{object-fit:contain;background:#f1f1f5}
.th.book{width:48px;height:64px;border-radius:9px}
.mn{background:none;border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mut)}
.mn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px;margin-top:10px}
.card{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .th{width:100%;height:auto;aspect-ratio:1/1;border-radius:22px}
.card .th.book{aspect-ratio:3/4;border-radius:14px}
.card .nm{font-weight:700;font-size:16px;margin:8px 4px 0;letter-spacing:-.2px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .sb{color:var(--mut);font-size:13px;margin:2px 4px 0}
.card .mn{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.88);color:#0d0d0f;width:34px;height:34px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mark{position:absolute;left:6px;top:6px;font-size:18px;background:rgba(255,255,255,.9);border-radius:12px;padding:1px 5px;line-height:1.3}
.it .mark{left:-4px;top:6px;font-size:15px}
.pinb{position:absolute;left:6px;bottom:6px;font-size:13px;background:#0d0d0f;color:#fff;border-radius:10px;padding:1px 6px}
/* collage */
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;width:100%;height:100%;padding:3px;background:#ececf3}
.collage i{background:#fff;border-radius:6px;overflow:hidden;display:block;font-style:normal;display:grid;place-items:center;color:#c2c2cc;font-size:13px}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.th.empty{display:grid;place-items:center;font-size:26px}
.th.noteic{display:grid;place-items:center;background:#fff7d6}
.th.noteic svg{width:30px;height:30px;stroke:#b79a21;fill:none;stroke-width:2;stroke-linecap:round}
.card .th.noteic{place-items:start;padding:14px;text-align:left;font-size:13px;line-height:1.3;color:#5a4d12;overflow:hidden;white-space:pre-line}
/* covers */
.cover{position:relative;width:100%;height:100%;overflow:hidden;background:#fff}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .ct{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;line-height:1.05;letter-spacing:-.5px;word-break:break-word;font-size:20px}
.th.book .cover .ct{display:none}
.card .cover .ct{font-size:21px}
.cover.big .ct{font-size:30px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* fab */
.fab{position:fixed;right:18px;bottom:calc(22px + var(--sab));width:64px;height:64px;border-radius:50%;background:var(--pink);color:#0d0d0f;border:0;box-shadow:0 10px 28px rgba(220,80,150,.35);display:grid;place-items:center;z-index:20}
.fab svg{width:30px;height:30px;stroke:#0d0d0f;stroke-width:2.6;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.94)}
.banner{display:flex;align-items:center;gap:10px;background:var(--lime);border-radius:20px;padding:12px 14px;font-weight:600;margin:12px 0;border:0;width:100%;text-align:left}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.empty img{width:170px;height:170px;border-radius:36px;display:block;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:20px;letter-spacing:-.4px;margin-bottom:6px}
/* sheet */
.bg{position:fixed;inset:0;background:rgba(20,10,40,.38);z-index:50;animation:fi .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:#fff;border-radius:30px 30px 0 0;z-index:51;padding:10px 18px calc(18px + var(--sab));max-height:88vh;overflow:auto;animation:su .22s ease-out}
.sheet .grip{width:42px;height:5px;border-radius:5px;background:#dcdce5;margin:0 auto 12px}
.sheet h3{margin:6px 0 12px;font-size:24px;letter-spacing:-.7px;font-weight:800}
.act{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 4px;font-size:17px;font-weight:600;text-align:left;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.act .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--soft)}
.act.red{color:#d6264a}
.act small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.inp{width:100%;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:18px;outline:none;background:#fff}
.inp:focus{border-color:#0d0d0f}
textarea.inp{min-height:150px;resize:vertical;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font-size:17px;font-weight:700;background:#0d0d0f;color:#fff}
.btn.pink{background:var(--pink);color:#0d0d0f}.btn.lime{background:var(--lime);color:#0d0d0f}.btn.soft{background:var(--soft);color:#0d0d0f}
.btn.wide{width:100%}
.btn:active{transform:scale(.97)}
.lbl{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.sw{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.sw .c{width:64px;height:86px;border-radius:12px;overflow:hidden;flex:none;border:3px solid transparent;padding:0;background:#fff}
.sw .c.on{border-color:#0d0d0f}
.sw .c svg,.sw .c img{width:100%;height:100%;display:block;object-fit:cover}
.sw .up{display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);text-align:center;padding:4px}
.marks{display:flex;gap:10px;flex-wrap:wrap}
.marks button{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--sab));background:#0d0d0f;color:#fff;border-radius:999px;padding:12px 18px;font-weight:600;z-index:80;display:flex;gap:14px;align-items:center;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fi .2s}
.toast button{background:none;border:0;color:var(--lime);font-weight:800;padding:0}
/* editor */
.ed-title{width:100%;border:0;outline:none;font-size:30px;font-weight:800;letter-spacing:-1px;padding:14px 0 6px;background:none;line-height:1.1}
.ed-body{min-height:60vh;outline:none;font-size:19px;line-height:1.5;padding:6px 0 20px;word-break:break-word;-webkit-user-select:text;user-select:text}
.ed-body:empty:before{content:attr(data-ph);color:#b8b8c2}
.ed-body div{min-height:1.5em}
.ed-body b{font-weight:800}
.edbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + var(--sab));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}
.edbar .pill{padding:11px 18px;font-size:16px}
/* photo viewer */
.pv{margin-top:10px;border-radius:22px;overflow:auto;background:#f1f1f5;max-height:68vh;text-align:center;-webkit-overflow-scrolling:touch}
.pv img{width:100%;display:block}
.pv.big img{width:230%;max-width:none}
/* crop */
.ovl{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;padding:calc(var(--sat) + 12px) 16px calc(24px + var(--sab));-webkit-overflow-scrolling:touch}
.cwrap{max-width:460px;margin:0 auto}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:999px;font-weight:700;font-size:16px}
.seg button.on{background:#0d0d0f;color:#fff}
.stage{position:relative;overflow:hidden;background:#e9e9ef;border-radius:22px;touch-action:none;margin:0 auto;user-select:none;-webkit-user-select:none}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.stage .grid3{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.55) 33%,rgba(255,255,255,.55) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.55) 66%,rgba(255,255,255,.55) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.55) 33%,rgba(255,255,255,.55) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.55) 66%,rgba(255,255,255,.55) calc(66% + 1px),transparent calc(66% + 1px))}
.fullimg{border-radius:22px;background:#f1f1f5;display:block;margin:0 auto;max-width:100%}
input[type=range]{width:100%;accent-color:#0d0d0f;margin:14px 0}
.hint{color:var(--mut);font-size:14px;text-align:center;margin:6px 0}
/* search */
.sbar{display:flex;gap:10px;align-items:center}
.sbar .inp{flex:1;border-radius:999px;padding:12px 18px}
.res{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.res .rt{flex:1;min-width:0}
.res b{display:block;font-size:17px;letter-spacing:-.2px}
.res .path{font-size:12px;color:var(--mut);margin-top:1px}
.res .sn{font-size:14px;color:#44444d;margin-top:3px;word-break:break-word}
mark{background:var(--lime);border-radius:4px;padding:0 1px;color:inherit}
/* lock */
.lock{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.lock img{width:120px;height:120px;border-radius:28px;margin-bottom:10px}
.lock h2{margin:6px 0 16px;font-size:24px;letter-spacing:-.6px}
.dots{display:flex;gap:14px;margin:6px 0 22px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #0d0d0f;display:block}
.dots i.on{background:#0d0d0f}
.dots.shake{animation:sh .35s}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px}
.pad button{height:78px;border-radius:50%;border:0;background:var(--soft);font-size:28px;font-weight:700}
.pad button:active{background:var(--pink)}
.pad .nb{background:none}
.lock .lk{margin-top:18px;background:none;border:0;color:var(--mut);font-weight:600}
.privacy{position:fixed;inset:0;background:#fff;z-index:99}
.set .act{border-top:1px solid var(--line)}
.set h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:26px 0 4px}
.note{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:15px;color:#3b3b44;margin:10px 0}
.tpl{border:2px solid var(--line);border-radius:20px;padding:14px;margin:10px 0}
.tpl b{font-size:18px}
.tpl p{margin:6px 0 10px;color:#55555e;font-size:14px;line-height:1.5}
.tpl .row{margin:0}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.dragghost{position:fixed;z-index:90;pointer-events:none;background:#0d0d0f;color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;max-width:70vw;box-shadow:0 12px 30px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-130%)}
.dragging{opacity:.35}
.dragmode .crumbs .pill[data-drop]{outline:2px dashed #0d0d0f;outline-offset:2px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

.card .th.book .cover .ct{display:block}
.th.book{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ===== stage 2 ===== */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;color:#0d0d0f;font-weight:800;background:var(--blue);vertical-align:middle;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.dash{outline:2px dashed #0d0d0f;outline-offset:-2px;opacity:.85}
.hd{display:flex;align-items:center;gap:14px;margin:18px 0 10px}
.hd .av{border-radius:20px}
.hd h1.tt{font-size:30px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(6px + var(--sab));max-width:720px;margin:0 auto}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);padding:4px 18px;border-radius:14px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#0d0d0f}.tab.on svg{stroke-width:2.6}
.fab.up{bottom:calc(84px + var(--sab))}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.calhead b{font-size:20px;letter-spacing:-.4px}
.calhead .ib{width:40px;height:40px}
.cal{margin-top:8px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--mut);font-size:12px;font-weight:700;margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dc{background:none;border:0;border-radius:14px;min-height:62px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dc .dn{font-size:15px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.dc.today .dn{background:var(--lime)}
.dc.sel{background:var(--soft);box-shadow:inset 0 0 0 2px #0d0d0f}
.dc .avs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:22px}
.dc .more{font-style:normal;font-size:11px;font-weight:800;background:var(--pink);border-radius:999px;padding:2px 5px;align-self:center}
.legend{display:flex;gap:16px;justify-content:center;color:var(--mut);font-size:12px;margin:10px 0;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ev{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.ev .evm{flex:1;min-width:0;background:none;border:0;display:flex;align-items:center;gap:12px;text-align:left;padding:4px 0}
.evt{display:block;min-width:0}
.evt b{display:block;font-size:16px;font-weight:700}
.evt span{display:block;color:var(--mut);font-size:13px}
.late{color:#d6264a;font-style:normal;font-weight:800}
.ev.rem{flex-wrap:wrap}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #0d0d0f;background:#fff;flex:none;font-weight:800;display:grid;place-items:center;padding:0}
.chk.on{background:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700}
.chip.on{background:#0d0d0f;color:#fff;border-color:#0d0d0f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{display:block;font-size:13px;font-weight:700;color:var(--mut)}
.two .inp{margin-top:4px;padding:12px;font-size:17px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid button{border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--soft)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== stage 3 ===== */
.pill.sm{padding:5px 11px;font-size:13px}
.lp{margin:6px 0}
.lead{flex-wrap:wrap}
.lacts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px 58px}
.lacts .pill{padding:7px 13px;font-size:14px}
.ev .evt span+span{margin-top:1px}
.tab{padding:4px 12px}
.segc{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px;margin:6px 0 4px}
.segc button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font-weight:700;font-size:15px}
.segc button.on{background:#0d0d0f;color:#fff}
.srow{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin:4px 0;border-radius:12px;overflow:hidden;font-size:15px}
.srow i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);opacity:.45;z-index:0;border-radius:12px}
.srow span,.srow b{position:relative;z-index:1}
.edbar .pill.dark{background:#0d0d0f;color:#fff}
.edbar .pill{padding:11px 15px}
.two>*{min-width:0}
.two .inp{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.sheet{overflow-x:hidden}
.pl{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

/* ===== storage (IndexedDB, memory fallback) ===== */
let db=null;const MEM={nodes:new Map(),blobs:new Map()};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('leads_v1',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('nodes',{keyPath:'id'});r.result.createObjectStore('blobs',{keyPath:'id'})};
 r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbPut=(st,o)=>db?idb(st,'readwrite',s=>s.put(o)):(MEM[st].set(o.id,o),Promise.resolve());
const dbGet=(st,id)=>db?idb(st,'readonly',s=>s.get(id)):Promise.resolve(MEM[st].get(id));
const dbDel=(st,id)=>db?idb(st,'readwrite',s=>s.delete(id)):(MEM[st].delete(id),Promise.resolve());
const dbAll=st=>db?idb(st,'readonly',s=>s.getAll()):Promise.resolve([...MEM[st].values()]);
const dbClear=st=>db?idb(st,'readwrite',s=>s.clear()):(MEM[st].clear(),Promise.resolve());

/* ===== nodes ===== */
const N=new Map();let CH=null;const PLAIN=new Map();
let RMC=null,TRC=null;const HBC=new Map();function dirty(){CH=null;RMC=null;TRC=null;HBC.clear()}
function rebuild(){CH=new Map();for(const n of N.values()){if(n.deleted||n.type==='task')continue;const k=n.parent||'';if(!CH.has(k))CH.set(k,[]);CH.get(k).push(n)}}
function kids(pid){if(!CH)rebuild();return CH.get(pid||'')||[]}
function allKids(pid){return [...N.values()].filter(n=>(n.parent||null)===(pid||null))}
function subtree(id){const out=[],st=[id];while(st.length){const x=st.pop();out.push(x);for(const k of allKids(x))st.push(k.id)}return out}
function pathOf(id){const out=[];let n=N.get(id);while(n){out.unshift(n);n=n.parent?N.get(n.parent):null}return out}
const CTC=new Map();
function saveNode(n,touch=true){if(touch)n.updated=Date.now();PLAIN.delete(n.id);CTC.clear();dirty();return dbPut('nodes',n).catch(e=>console.error(e))}
function newNode(type,parent,extra){const sib=allKids(parent);const o=Math.max(0,...sib.map(s=>s.order||0))+1;
 const n=Object.assign({id:uid(),type,parent:parent||null,title:'',mark:'',pinned:0,order:o,created:Date.now(),updated:Date.now(),deleted:0},extra||{});N.set(n.id,n);dirty();return n}
function plainOf(n){let p=PLAIN.get(n.id);if(p!=null)return p;
 if(n.type==='note'){const d=document.createElement('div');d.innerHTML=(n.html||'').replace(/<\/(div|p|li)>|<br\s*\/?>/gi,'$&\n');p=(d.textContent||'').replace(/ /g,' ')}
 else p=n.caption||'';PLAIN.set(n.id,p);return p}
function nodeTitle(n){if(n.title)return n.title;if(n.type==='note'){const f=plainOf(n).split('\n').map(s=>s.trim()).find(Boolean);return f?f.slice(0,60):'Без названия'}
 if(n.type==='photo')return n.caption||'Фото';return 'Без названия'}
function isDesc(id,anc){let n=N.get(id);while(n){if(n.id===anc)return true;n=n.parent?N.get(n.parent):null}return false}
function counts(pid){const c={col:0,note:0,photo:0};for(const k of kids(pid)){if(k.type==='photo')c.photo++;else if(k.type==='note')c.note++;else c.col++}return c}
function countAll(id){let c=0;const st=[id];while(st.length){const x=st.pop();for(const k of kids(x)){c++;if(k.type==='col')st.push(k.id)}}return c}
const SORTS={manual:'Вручную',new:'Сначала новые',old:'Сначала старые',name:'По названию',upd:'Недавно изменённые',meet:'По дате встречи',plan:'Когда писать',warm:'По теплоте'};
function sortedKids(pid){const m=SET.sorts[pid||'root']||(pid?'new':'manual');const f={manual:(a,b)=>(a.order||0)-(b.order||0),new:(a,b)=>b.created-a.created,old:(a,b)=>a.created-b.created,
 name:(a,b)=>nodeTitle(a).localeCompare(nodeTitle(b),'ru'),upd:(a,b)=>b.updated-a.updated,meet:(a,b)=>lastMeet(b)-lastMeet(a),plan:(a,b)=>planKey(a)-planKey(b),warm:(a,b)=>(WRANK[a.w||'ok']-WRANK[b.w||'ok'])||nodeTitle(a).localeCompare(nodeTitle(b),'ru')}[m];
 return kids(pid).slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||((a.type==='col'?0:1)-(b.type==='col'?0:1))||f(a,b))}

const BU=new WeakMap();
function bu(b){if(!b)return'';let u=BU.get(b);if(!u){u=URL.createObjectURL(b);BU.set(b,u)}return u}

/* ===== images ===== */
async function loadImg(src){const u=src instanceof Blob?URL.createObjectURL(src):src;const im=new Image();im.src=u;
 try{await im.decode()}catch(e){await new Promise((r,j)=>{im.onload=r;im.onerror=()=>j(new Error('img'))})}return {im,u}}
function drawTo(im,sx,sy,sw,sh,dw,dh,q){const c=document.createElement('canvas');c.width=Math.max(1,dw);c.height=Math.max(1,dh);const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',q))}
async function makeSrc(file){const {im,u}=await loadImg(file);const iw=im.naturalWidth,ih=im.naturalHeight,ratio=iw/ih;
 const extreme=ratio<0.65||ratio>1.6;const lim=extreme?2600:2000;const sc=Math.min(1,lim/Math.max(iw,ih));
 const blob=await drawTo(im,0,0,iw,ih,Math.round(iw*sc),Math.round(ih*sc),extreme?.9:.85);URL.revokeObjectURL(u);
 return {blob,w:Math.round(iw*sc),h:Math.round(ih*sc),extreme}}
async function buildAssets(im,mode,rect){const iw=im.naturalWidth,ih=im.naturalHeight;let view=null,thumb;
 if(mode==='square'){const sx=rect.x*iw,sy=rect.y*ih,sw=Math.min(rect.w*iw,rect.h*ih);const out=Math.min(1600,Math.round(sw));
  view=await drawTo(im,sx,sy,sw,sw,out,out,.88);thumb=await drawTo(im,sx,sy,sw,sw,480,480,.8)}
 else{const sc=480/Math.max(iw,ih);thumb=await drawTo(im,0,0,iw,ih,Math.round(iw*sc),Math.round(ih*sc),.8)}
 return {view,thumb}}

/* ===== cropper ===== */
function Cropper(stage,img,init){
 const Fw=stage.clientWidth,Fh=stage.clientHeight,iw=img.naturalWidth,ih=img.naturalHeight;
 const s0=Math.max(Fw/iw,Fh/ih);let z=1,tx=0,ty=0;const P=new Map();let pd=0;
 const clamp=()=>{const sc=s0*z;tx=Math.min(0,Math.max(Fw-iw*sc,tx));ty=Math.min(0,Math.max(Fh-ih*sc,ty))};
 const apply=()=>{clamp();img.style.width=iw+'px';img.style.height=ih+'px';img.style.transform=`translate(${tx}px,${ty}px) scale(${s0*z})`;onz&&onz(z)};
 let onz=null;
 function setZoom(nz,cx=Fw/2,cy=Fh/2){nz=Math.max(1,Math.min(6,nz));const a=s0*z,b=s0*nz,px=(cx-tx)/a,py=(cy-ty)/a;z=nz;tx=cx-px*b;ty=cy-py*b;apply()}
 if(init){const sc=Fw/(init.w*iw);z=Math.max(1,Math.min(6,sc/s0));tx=-init.x*iw*s0*z;ty=-init.y*ih*s0*z}else{tx=(Fw-iw*s0)/2;ty=(Fh-ih*s0)/2}
 apply();
 const pos=e=>{const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
 stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);P.set(e.pointerId,pos(e));pd=0});
 stage.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=pos(e);
  if(P.size===1){tx+=n.x-o.x;ty+=n.y-o.y;P.set(e.pointerId,n);apply()}
  else if(P.size===2){P.set(e.pointerId,n);const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)setZoom(z*d/pd,(a.x+b.x)/2,(a.y+b.y)/2);pd=d}});
 const up=e=>{P.delete(e.pointerId);pd=0};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
 stage.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);setZoom(z*(e.deltaY<0?1.1:.9),p.x,p.y)},{passive:false});
 return {setZoom,zoom:()=>z,onZoom:f=>{onz=f},rect(){const sc=s0*z;return {x:Math.max(0,-tx/sc/iw),y:Math.max(0,-ty/sc/ih),w:Math.min(1,Fw/sc/iw),h:Math.min(1,Fh/sc/ih)}}}
}

  case'caltoday':{const d=new Date();CAL=Object.assign(CAL,{y:d.getFullYear(),m:d.getMonth(),sel:dkey(Date.now())});render();break}
  case'calday':CAL.sel=a.dataset.day;render();break;
  case'meetnew2':{const p=await pickPerson('С кем встреча?');if(p)meetSheet(p,null,a.dataset.day);break}
  case'meetnew':if(n)meetSheet(n,null);break;
  case'meets':if(n)meetsSheet(n);break;
  case'meetedit':if(n&&mt)meetSheet(n,mt);break;
  case'remdone':if(mt){mt.rDone=Date.now();await saveNode(n,false);render();toast('Отмечено','Отменить',async()=>{mt.rDone=0;await saveNode(n,false);render()})}break;

  case'tnew':taskSheet(null);break;

  case'remsettings':remSettings();break;
  case'rates':{toast('Обновляю курсы…');const ok=await loadRates(true);toast(ok?'Курсы обновлены':'Нет интернета, остались прежние курсы');render();break}
  case'lockafter':menuSheet('Когда просить PIN',[{ic:'⚡',t:'Сразу, как только выйду из приложения',fn:()=>{SET.lockAfter=0;saveSet();render()}},{ic:'⏱️',t:'Через 1 минуту',fn:()=>{SET.lockAfter=60000;saveSet();render()}},{ic:'🕔',t:'Через 5 минут',fn:()=>{SET.lockAfter=300000;saveSet();render()}}]);break;
  case'locknow':lockNow();break;

 }}

const INTD={some:30,never:30,half:180,sleep:120,'':30},WFAC={hot:.7,ok:1,cold:1.5};
const CITIES0=['Дубай','Москва','Краснодар','Ростов','Париж','Стамбул'];
const cityList=()=>SET.cities&&SET.cities.length?SET.cities:CITIES0;
const dailyN=()=>SET.dailyN||20,sleepN=()=>SET.sleepAfter||5;
const sod=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const eod=ts=>sod(ts)+864e5-1;
const at11=ts=>{const d=new Date(ts);d.setHours(18,0,0,0);return d.getTime()};
/* ----- habit: usual weekday & time of meetings ----- */
const leadH=()=>SET.leadH||4;
const fmtMi=mi=>p2(Math.floor(mi/60)%24)+':'+p2(mi%60);
function habitOf(n){if(HBC.has(n.id))return HBC.get(n.id);let r=null;const ms=meetsOf(n).filter(m=>!m.nt);
 if(ms.length>=2){const pts=ms.map(m=>{const d=new Date(m.ts);let mi=d.getHours()*60+d.getMinutes(),dw=d.getDay();if(d.getHours()<5){mi+=1440;dw=(dw+6)%7}return{mi,dw,ts:m.ts}});
  let best=null,bc=0;for(const p of pts){const c=pts.filter(q=>Math.abs(q.mi-p.mi)<=60).length;if(c>bc||(c===bc&&p.ts>best.ts)){bc=c;best=p}}
  const cl=pts.filter(q=>Math.abs(q.mi-best.mi)<=60).map(q=>q.mi).sort((a,b)=>a-b);const mi=Math.round(cl[Math.floor(cl.length/2)]/15)*15;
  const cd={};pts.forEach(p=>cd[p.dw]=(cd[p.dw]||0)+1);const last=pts.slice().sort((a,b)=>b.ts-a.ts)[0].dw;let dw=-1,dn=0;for(const k in cd)if(cd[k]>dn||(cd[k]===dn&&+k===last)){dn=cd[k];dw=+k}
  r={mi,dw,n:ms.length,sure:bc>=2}}
 HBC.set(n.id,r);return r}
function atW(n,ts){const h=n?habitOf(n):null;const d=new Date(ts);d.setHours(0,0,0,0);if(!h){d.setHours(18,0,0,0);return d.getTime()}return d.getTime()+Math.max(0,h.mi-leadH()*60)*6e4}
const habitTxt=h=>h?'обычно '+DOWF[h.dw]+' ~'+fmtMi(h.mi)+' → писать в ~'+fmtMi(Math.max(0,h.mi-leadH()*60)):'';
const fmtPlan=ts=>{const d=new Date(ts);return DOW[(d.getDay()+6)%7]+', '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function relDay(ts){const k=Math.round((sod(ts)-sod(Date.now()))/864e5);return k===0?'сегодня':k===1?'завтра':k===-1?'вчера':k<0?(-k)+' дн. назад':'через '+k+' дн.'}

/* ----- who is a lead ----- */
const isLead=n=>n.type==='col'&&!!n.parent&&!n.deleted&&!kids(n.id).some(k=>k.type==='col');
const leads=()=>[...N.values()].filter(isLead);
function guessCity(n){const low=pathOf(n.id).map(x=>nq(nodeTitle(x)));for(const c of cityList()){const k=nq(c);if(low.some(t=>t.includes(k)))return c}return''}
function citiesOf(n){if(n.cities&&n.cities.length)return n.cities;const g=guessCity(n);return g?[g]:[]}
function districtsOf(c){const s=new Set();for(const n of leads())if(n.dist&&n.dist[c])s.add(n.dist[c]);return[...s].sort((a,b)=>a.localeCompare(b,'ru'))}
const here=()=>{if(SET.here&&SET.here.until>Date.now())return SET.here;{const st=stayAt(Date.now());if(st)return{city:st.city,dist:st.dist||'',until:st.to?eod(st.to):eod(Date.now()+30*864e5),stay:1}}const now=Date.now();const t=(SET.trips||[]).find(t=>sod(t.from)<=now&&eod(t.to)>=now);return t?{city:t.city,dist:'',until:eod(t.to),trip:1}:null};

function remMapAll(){if(RMC)return RMC;const m=new Map();for(const r of activeReminders())if(!m.has(r.n.id))m.set(r.n.id,r);return RMC=m}
function prefDow(n){const hb=habitOf(n);if(hb)return hb.dw;const ms=meetsOf(n);if(!ms.length)return-1;const c={};ms.forEach(m=>{const d=new Date(m.ts).getDay();c[d]=(c[d]||0)+1});const ld=new Date(lastMeet(n)).getDay();let best=-1,bn=0;for(const k of Object.keys(c)){if(c[k]>bn||(c[k]===bn&&+k===ld)){bn=c[k];best=+k}}return best}
function snapDow(ts,dw){const d=new Date(ts);d.setDate(d.getDate()+((dw-d.getDay()+7)%7));return d.getTime()}
function planOf(n,rm){
 if(n.st==='stop')return null;
 if(n.plan)return{ts:n.plan,src:'manual',why:'дата выбрана тобой'};
 const tp=tripPlans().get(n.id);if(tp)return{ts:tp.ts,src:'trip',why:'поездка: '+tp.trip.city+', '+fmtTrip(tp.trip)};
 const r=(rm||remMapAll()).get(n.id);
 if(r){const c=remCfg(r.m);return{ts:r.due,src:'rem',why:'встреча '+fmtDate(r.m.ts)+' + '+c.w+' нед.'}}
 if(n.st==='self')return null;
 const base=Math.max(n.lt||0,n.la||0,lastMeet(n));
 if(!base&&!n.st)return{ts:0,src:'new',why:'ещё не писала'};
 if(!base)return{ts:Date.now(),src:'auto',why:'статус задан, ещё не писала'};
 const days=Math.round((INTD[n.st||'']||30)*WFAC[n.w||'ok']);let ts=base+days*864e5;let why=(n.st?'«'+ST[n.st].t+'»':'без статуса')+', каждые ~'+days+' дн.';
 const dw=prefDow(n);const hb=habitOf(n);if(dw>=0){ts=snapDow(ts,dw);why+=hb?' · '+habitTxt(hb):' · день встреч: '+DOWF[dw]}
 return{ts:atW(n,ts),src:'auto',why}}

/* ----- trips ----- */
const addDays=(ts,k)=>{const d=new Date(ts);d.setDate(d.getDate()+k);return d.getTime()};
function fmtTrip(t){const a=new Date(t.from),b=new Date(t.to);return a.getMonth()===b.getMonth()?(a.getDate()===b.getDate()?a.getDate():a.getDate()+'–'+b.getDate())+' '+MONTHS[b.getMonth()]:a.getDate()+' '+MONTHS[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+MONTHS[b.getMonth()].slice(0,3)}
function tripEligible(t,rm){const ws=addDays(sod(t.from),-(t.lead||5));const out=[];for(const n of leads()){if(n.st==='stop'||n.plan)continue;if(n.st==='sleep'&&!t.sleep)continue;if(!citiesOf(n).includes(t.city))continue;if(Math.max(n.lt||0,n.la||0)>=ws)continue;out.push(n)}
 out.sort((a,b)=>WRANK[a.w||'ok']-WRANK[b.w||'ok']||Math.max(a.lt||0,a.la||0,lastMeet(a))-Math.max(b.lt||0,b.la||0,lastMeet(b))||(a.created||0)-(b.created||0));return out}
function tripPlans(){if(TRC)return TRC;const m=new Map(),s0=sod(Date.now());TRC=m;
 for(const t of(SET.trips||[]).filter(t=>eod(t.to)>=Date.now()).sort((a,b)=>a.from-b.from)){const ws=addDays(sod(t.from),-(t.lead||5)),start=Math.max(s0,ws),per=t.per||dailyN();
  tripEligible(t).filter(n=>!m.has(n.id)).forEach((n,i)=>m.set(n.id,{ts:atW(n,addDays(start,Math.floor(i/per))),trip:t}))}
 return m}
function tripsSheet(){const now=Date.now();const list=(SET.trips||[]).slice().sort((a,b)=>a.from-b.from);
 const el=sheet(`<h3>Поездки</h3><div class="hint" style="text-align:left">Укажи, когда и куда едешь. Всем людям из этого города приложение само поставит даты «когда писать» перед приездом, по нескольку десятков в день.</div>
 ${list.length?list.map((t,i)=>{const past=eod(t.to)<now;const k=past?0:tripEligible(t).length;return `<button class="act" data-i="${i}" style="${past?'opacity:.5':''}"><span class="ic">✈️</span><span>${esc(t.city)} · ${fmtTrip(t)}<small>${past?'поездка прошла':'писать с '+fmtPlan(Math.max(sod(now),addDays(sod(t.from),-(t.lead||5))))+' · людей: '+k}</small></span></button>`}).join(''):'<p class="hint">Поездок пока нет</p>'}
 <div class="row" style="margin-top:12px"><button class="btn pink wide" id="tnw">＋ Новая поездка</button></div>`);
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>tripEdit(list[+b.dataset.i]));el.querySelector('#tnw').onclick=()=>tripEdit(null)}
function tripEdit(t,dr){const d1=addDays(sod(Date.now()),14);
 const D=dr||(t?Object.assign({},t):{id:uid(),city:'',from:d1,to:addDays(d1,2),lead:5,per:dailyN(),sleep:0});
 const cl=[...new Set([...cityList(),...(D.city?[D.city]:[])])];
 const el=sheet(`<h3>${t?'Поездка':'Новая поездка'}</h3><div class="lbl">Город</div>${chips('tc',cl,D.city)}<div class="row"><button class="pill ghost" id="tac">＋ Другой город</button></div>
 <div class="two"><label>Приезжаю<input class="inp" type="date" id="tf" value="${ymd(new Date(D.from))}"></label><label>Уезжаю<input class="inp" type="date" id="tt2" value="${ymd(new Date(D.to))}"></label></div>
 <div class="lbl">За сколько дней начать писать</div>${chips('tl',[3,5,7,10,14],D.lead)}
 <div class="lbl">Сколько людей в день</div>${chips('tp',[10,15,20,30,40],D.per)}
 <div class="lbl">Писать спящим</div>${chips('ts',['0','1'],String(D.sleep?1:0),v=>v==='1'?'Да':'Нет')}
 <div class="note" id="tpv"></div>
 <div class="row" style="margin-top:12px"><button class="btn pink wide" id="tsv">Сохранить</button></div>${t?'<div class="row"><button class="pill ghost" id="tdl" style="color:#d6264a">Удалить поездку</button></div>':''}`);
 const rd=()=>{const f=el.querySelector('#tf').value.split('-').map(Number),g=el.querySelector('#tt2').value.split('-').map(Number);D.from=new Date(f[0],f[1]-1,f[2]).getTime();D.to=new Date(g[0],g[1]-1,g[2]).getTime();if(!isFinite(D.from)||!isFinite(D.to))return false;if(D.to<D.from)D.to=D.from;return true};
 const pv=()=>{const box=el.querySelector('#tpv');if(!D.city||!rd()){box.textContent=D.city?'Проверь даты':'Выбери город';return}const k=tripEligible(D).length,days=Math.max(1,Math.ceil(k/D.per)),st=Math.max(sod(Date.now()),addDays(sod(D.from),-D.lead));
  box.innerHTML=k?`Людей из «${esc(D.city)}»: <b>${k}</b>. Писать с <b>${fmtPlan(st)}</b>, примерно ${days} ${plural(days,'день','дня','дней')} по ${D.per} в день.`:`В «${esc(D.city)}» пока никого нет. Город берётся из карточки человека или из названия книжки.`};
 chipsBind(el,'tc',v=>{D.city=v;pv()});chipsBind(el,'tl',v=>{D.lead=+v;pv()});chipsBind(el,'tp',v=>{D.per=+v;pv()});chipsBind(el,'ts',v=>{D.sleep=+v;pv()});
 el.querySelector('#tf').onchange=()=>{rd();pv()};el.querySelector('#tt2').onchange=()=>{rd();pv()};pv();
 el.querySelector('#tac').onclick=async()=>{rd();const v=await inputSheet({title:'Новый город',ph:'Например: Милан'});if(v&&v.trim()){const c=v.trim();SET.cities=[...cityList().filter(x=>x!==c),c];saveSet();D.city=c}tripEdit(t,D)};
 el.querySelector('#tsv').onclick=()=>{if(!D.city){toast('Выбери город');return}if(!rd()){toast('Проверь даты');return}const l=(SET.trips||[]).filter(x=>x.id!==D.id);l.push(D);SET.trips=l;saveSet();closeSheet();render();toast('Поездка сохранена')};
 const dl=el.querySelector('#tdl');if(dl)dl.onclick=async()=>{if(!await ask('Удалить поездку?','Даты «когда писать» от неё пропадут.','Удалить',true)){tripEdit(t,D);return}SET.trips=(SET.trips||[]).filter(x=>x.id!==D.id);saveSet();render()}}

/* ----- touches ----- */
const LF=['st','w','tc','lt','la','plan','ansAt','lk','tot','wd','zc','zs','wh','pm','pmAt','pmh'];
function snapLead(n){const o={};LF.forEach(k=>o[k]=Array.isArray(n[k])?n[k].slice():n[k]);o.meets=JSON.parse(JSON.stringify(n.meets||[]));return o}
function restoreLead(n,o){LF.forEach(k=>{if(o[k]===undefined)delete n[k];else n[k]=Array.isArray(o[k])?o[k].slice():o[k]});n.meets=o.meets}
function doneRem(n){const r=remMapAll().get(n.id);if(r)r.m.rDone=Date.now()}
async function undoLead(n,sn){restoreLead(n,sn);await saveNode(n,false);render()}
async function doTouch(n){return doWait(n)}
async function doAnswered(n){const sn=snapLead(n);n.ansAt=[...(n.ansAt||[]),n.tc||0];n.tc=0;n.la=Date.now();n.lk='a';n.plan=0;n.wh=[...(n.wh||[]),...(n.wd||[])];n.wd=[];n.zs=0;n.zc=0;doneRem(n);
 if(!n.st||n.st==='never'||n.st==='sleep')n.st='some';await saveNode(n,false);render();
 toast('Ответил: '+nodeTitle(n),'Отменить',()=>undoLead(n,sn));
 menuSheet('Что дальше с «'+nodeTitle(n)+'»?',[
  {ic:'📅',t:'Записать встречу',fn:()=>meetSheet(n,null)},
  {ic:'⏱️',t:'Написать снова через 3 дня',fn:()=>setPlan(n,atW(n,Date.now()+3*864e5))},
  {ic:'📆',t:'Через неделю',fn:()=>setPlan(n,atW(n,Date.now()+7*864e5))},
  {ic:'🗓️',t:'Выбрать дату…',fn:()=>planDateSheet(n)},
  {ic:'👌',t:'Пока ничего'}])}
async function setPlan(n,ts){n.plan=ts||0;await saveNode(n,false);render();if(ts)toast('Напомню: '+fmtPlan(ts))}
function laterMenu(n){const d=k=>atW(n,Date.now()+k*864e5);menuSheet('Написать позже: '+nodeTitle(n),[
 {ic:'🌅',t:'Завтра',fn:()=>setPlan(n,d(1))},{ic:'⏱️',t:'Через 3 дня',fn:()=>setPlan(n,d(3))},{ic:'📆',t:'Через неделю',fn:()=>setPlan(n,d(7))},
 {ic:'🗓️',t:'Через 2 недели',fn:()=>setPlan(n,d(14))},{ic:'🌙',t:'Через месяц',fn:()=>setPlan(n,d(30))},{ic:'✏️',t:'Выбрать дату…',fn:()=>planDateSheet(n)}])}

 const el=sheet(`<h3>Когда написать: ${esc(nodeTitle(n))}</h3>${p&&p.ts?`<div class="hint" style="text-align:left">Сейчас: ${fmtPlan(p.ts)} · ${esc(p.why)}</div>`:''}
 <div class="two" style="margin-top:10px"><label>Дата<input class="inp" type="date" id="pd" value="${ymd(d0)}"></label><label>Время<input class="inp" type="time" id="pt" value="${hhmm(d0.getTime())}"></label></div>
 <div class="hint" id="pdw" style="text-align:left"></div>
 <div class="row">${[[1,'Завтра'],[3,'3 дня'],[7,'Неделя'],[14,'2 нед.'],[21,'3 нед.'],[30,'Месяц']].map(([k,t],i)=>`<button class="pill c${i%5+1}" data-q="${k}">${t}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn pink wide" id="ps">Поставить дату</button></div>${n.plan?'<div class="row"><button class="pill ghost" id="pc">Убрать мою дату</button></div>':''}`);
 const val=()=>{const [y,m,d]=el.querySelector('#pd').value.split('-').map(Number),[hh,mm]=(el.querySelector('#pt').value||'18:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm).getTime()};
 const dw=()=>{const t=val();el.querySelector('#pdw').textContent=isFinite(t)?DOWF[new Date(t).getDay()]+' · '+relDay(t):''};dw();
 el.querySelector('#pd').onchange=dw;el.querySelector('#pt').onchange=dw;
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const t=atW(n,Date.now()+ +b.dataset.q*864e5);el.querySelector('#pd').value=ymd(new Date(t));el.querySelector('#pt').value=hhmm(t);dw()});
 el.querySelector('#ps').onclick=()=>{const t=val();if(!isFinite(t)){toast('Проверь дату');return}closeSheet();setPlan(n,t)};
 const pc=el.querySelector('#pc');if(pc)pc.onclick=()=>{closeSheet();setPlan(n,0)}}
function planMenu(n){const p=planOf(n);const rows=[{ic:'✅',t:'Написала',fn:()=>doTouch(n)},{ic:'💬',t:'Ответил',fn:()=>doAnswered(n)},{ic:'🗓️',t:'Перенести…',fn:()=>planDateSheet(n)}];
 if(p&&p.ts)rows.push({ic:'📲',t:'В календарь iPhone',fn:()=>shareICS([{uid:'plan-'+n.id+'-'+p.ts,start:Math.max(p.ts,Date.now()+6e4),title:'Написать: '+nodeTitle(n),desc:p.why}],'napomni.ics')});
 if(n.plan)rows.push({ic:'↩️',t:'Убрать мою дату, пусть считает сама',fn:()=>setPlan(n,0)});
 menuSheet('Написать: '+nodeTitle(n)+(p&&p.ts?' · '+fmtPlan(p.ts):''),rows)}

function leadRowPills(n){if(!isLead(n))return'';const ps=[];
 const w=n.w||'ok';if(n.st)ps.push(`<i class="pill sm ${ST[n.st].c}">${WE[w]} ${ST[n.st].t}</i>`);else if(w!=='ok')ps.push(`<i class="pill sm ghost">${WE[w]} ${WT[w]}</i>`);
 const ms=meetsOf(n).slice().sort((a,b)=>a.ts-b.ts);const sh=ms.slice(-6);if(ms.length>6)ps.push(`<i class="pill sm ghost">+${ms.length-6}</i>`);sh.forEach((m,i)=>ps.push(`<i class="pill sm c3">${fmtShort(m.ts)}</i>`));
 const ds=citiesOf(n).map(c=>n.dist&&n.dist[c]).filter(Boolean);if(ds.length)ps.push(`<i class="pill sm ghost">📍 ${esc(ds.join(', '))}</i>`);
 if(bdOf(n))ps.push(`<i class="pill sm ghost">🎂 ${p2(n.bd.d)}.${p2(n.bd.m)}</i>`);
 const s=sumNode(n.id);if(s.aed>0)ps.push(`<i class="pill sm ghost">💰 ${nf0.format(Math.round(s.aed))} AED = ${nf0.format(Math.round(s.rub))} ₽</i>`);
 const p=planOf(n);if(p&&p.ts&&p.src!=='new')ps.push(`<i class="pill sm ghost">✉ ${fmtPlan(p.ts).replace(/^.{2}, /,'')}</i>`);
 return ps.length?`<div class="pl">${ps.join('')}</div>`:''}

 {const hb=habitOf(n);if(hb)h+=`<span class="pill sm ghost">🕐 обычно ${DOW[(hb.dw+6)%7].toLowerCase()} ~${fmtMi(hb.mi)} · писать ~${fmtMi(Math.max(0,hb.mi-leadH()*60))}</span>`}

 h+='</div><div class="row lp">';
  if(n.tc)h+=`<span class="pill sm ghost">без ответа: ${n.tc}</span>`;
 h+=`<button class="pill sm ghost" data-act="ltouch" data-id="${id}">Написала</button><button class="pill sm ghost" data-act="lans" data-id="${id}">Ответил</button></div>`;
 const ms=meetsOf(n).slice().sort((a,b)=>b.ts-a.ts);
 if(ms.length){const d=x=>new Date(x.ts);h+=`<div class="row lp">${ms.slice(0,6).map((m,i)=>`<button class="pill sm c3" data-act="meetedit" data-id="${id}" data-m="${m.id}">${d(m).getDate()} ${MONTHS[d(m).getMonth()].slice(0,3)}</button>`).join('')}${ms.length>6?`<button class="pill sm ghost" data-act="meets" data-id="${id}">+${ms.length-6}</button>`:''}${avgAed(n)>0?`<span class="pill sm ghost">💵 обычно ${nf0.format(Math.round(avgAed(n)))} AED</span>`:''}</div>`}
 return h}

function monthsSheet(){const g={};for(const x of allMeets()){const d=new Date(x.m.ts),k=d.getFullYear()*12+d.getMonth();const o=g[k]=g[k]||{k,y:d.getFullYear(),m:d.getMonth(),c:0,aed:0,rub:0,p:new Set()};o.c++;o.aed+=x.m.aed||0;o.rub+=x.m.rub||0;o.p.add(x.n.id)}
 const arr=Object.values(g).sort((a,b)=>b.k-a.k);const mx=Math.max(1,...arr.map(o=>o.aed));
 const years={};arr.forEach(o=>{const y=years[o.y]=years[o.y]||{aed:0,rub:0,c:0};y.aed+=o.aed;y.rub+=o.rub;y.c+=o.c});
 sheet(`<h3>📊 Заработок по месяцам</h3>${arr.length?arr.map(o=>`<div class="mrow"><div class="mh"><b>${MONF[o.m]} ${o.y}</b><span>${o.c} ${plural(o.c,'встреча','встречи','встреч')} · ${o.p.size} ${plural(o.p.size,'человек','человека','человек')}</span></div><div class="mb"><i style="width:${Math.round(o.aed/mx*100)}%"></i></div><div class="mv">${nf0.format(Math.round(o.aed))} AED <span>≈ ${nf0.format(Math.round(o.rub))} ₽</span></div></div>`).join('')

  :'<p class="hint" style="text-align:left">Пока нет встреч с суммой. Записывай встречи через «＋ Встреча» в карточке человека, и здесь появится заработок по месяцам.</p>'}

/* ===== stage 6: meetings from notes ===== */
const WDR='(?:пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среда|среду|четверг|пятница|пятницу|суббота|субботу|воскресенье)';
const MONW=[['январ',1],['феврал',2],['март',3],['апрел',4],['ма',5],['июн',6],['июл',7],['август',8],['сентябр',9],['октябр',10],['ноябр',11],['декабр',12]];
const CURW=[[/^\$|^usd|^долл/i,'USD'],[/^€|^eur|^евро/i,'EUR'],[/^₽|^руб/i,'RUB'],[/^aed|^дирх/i,'AED'],[/^₺|^лир/i,'TRY']];
const curOfTok=t=>{for(const [r,c] of CURW)if(r.test(t))return c;return null};
const numOf=s=>parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.'));
const NUM='(\\d{1,3}(?:[ \\u00a0]\\d{3})+|\\d+)(?:[.,](\\d+))?';
function moneyIn(s){const S=' '+s.replace(/(?:^|[^\d])([01]?\d|2[0-3]):[0-5]\d(?!\d)/g,' ')+' ';let m;
 const val=(a,b)=>numOf(a+(b?'.'+b:''));
 if((m=S.match(new RegExp('(\\$|€|₽)\\s?'+NUM+'\\s?(к|k)?(?![a-zа-яё])','i'))))return{a:val(m[2],m[3])*(m[4]?1000:1),c:curOfTok(m[1]),raw:m[0].trim()};
 if((m=S.match(new RegExp('(?:^|[^\\d.,:])'+NUM+'\\s?(к|k|тыс\\.?)?\\s?(\\$|€|₽|₺|aed|дирх[а-яё]*|usd|долл[а-яё]*|eur|евро|руб[а-яё]*|лир[а-яё]*)(?![a-zа-яё])','i'))))return{a:val(m[1],m[2])*(m[3]?1000:1),c:curOfTok(m[4]),raw:m[0].trim()};
 if((m=S.match(/(?:^|[^\d.,:])(\d+(?:[.,]\d+)?)\s?(к|k)(?![a-zа-яё])/i)))return{a:Math.round(numOf(m[1])*1000),c:'AED',raw:m[0].trim()};
 if((m=S.match(/(?:^|[^\d.,:])0[.,](\d)(?![\d.,:])/)))return{a:+m[1]*100,c:'AED',raw:m[0].trim()};
 return null}
function timeIn(s){const m=s.match(/(?:^|[^\d])([01]?\d|2[0-3]):([0-5]\d)(?!\d)/);return m?{h:+m[1],mi:+m[2]}:null}
function dateIn(line){let m=line.match(new RegExp('^\\s*(?:дата\\s*:?\\s*)?(?:'+WDR+'\\.?,?\\s*)?(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4}|\\d{2})(?!\\d)(.*)$','i'));
 if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return{d:+m[1],mo:+m[2],y,rest:m[4]||''}}
 m=line.match(new RegExp('^\\s*(?:дата\\s*:?\\s*)?(?:'+WDR+'\\.?,?\\s*)?(\\d{1,2})\\s+([а-яё]+)\\s+(\\d{4})(.*)$','i'));
 if(m){const w=m[2].toLowerCase();const mo=(MONW.find(x=>w.startsWith(x[0])&&(x[0]!=='ма'||/^ма[йя]/.test(w)))||[])[1];if(mo)return{d:+m[1],mo,y:+m[3],rest:m[4]||''}}
 return null}
function mkTs(D,t){const d=new Date(D.y,D.mo-1,D.d,t?t.h:12,t?t.mi:0);if(d.getMonth()!==D.mo-1||d.getDate()!==D.d)return null;return d.getTime()}
/* scan one person: returns found meetings (not yet saved) */
function scanLead(n){const out=[];const notes=kids(n.id).filter(k=>k.type==='note');const now=Date.now()+864e5;
 for(const nt of notes){const lines=plainOf(nt).split('\n').map(x=>x.replace(/ /g,' ').trim()).filter(Boolean);
  const dl=lines.findIndex(l=>/^дата\s*:/i.test(l));
  if(dl>=0){const D=dateIn(lines[dl]);if(D){const tl=lines.find(l=>/^время\s*:/i.test(l));const t=timeIn(tl?tl.replace(/^время\s*:/i,''):D.rest);const ul=lines.find(l=>/^(условия|сумма|деньги)\s*:/i.test(l));
    const mo=moneyIn(ul?ul.replace(/^[^:]+:/,''):lines.filter((l,i)=>i!==dl&&!/^(время|продолжительность)\s*:/i.test(l)).join(' '));const ts=mkTs(D,t);
    if(ts&&ts<=now)out.push({n,ts,nt:!t,a:mo?mo.a:0,c:mo&&mo.c?mo.c:'AED',line:lines[dl].slice(0,80),note:nt.id})}continue}
  for(const l of lines){const D=dateIn(l);if(!D)continue;const t=timeIn(D.rest);const mo=moneyIn(D.rest);const ts=mkTs(D,t);if(!ts||ts>now)continue;
   out.push({n,ts,nt:!t,a:mo?mo.a:0,c:mo&&mo.c?mo.c:'AED',line:l.slice(0,90),note:nt.id})}}
 const ms=meetsOf(n);for(const x of out)x.dup=ms.some(m=>Math.abs(m.ts-x.ts)<6*36e5||dkey(m.ts)===dkey(x.ts));
 const seen=new Set();return out.filter(x=>{const k=dkey(x.ts);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.ts-b.ts)}
function scanAll(){let all=[];for(const n of leads())all=all.concat(scanLead(n).filter(x=>!x.dup));return all}
/* review & save */
const fmtShortDT=(ts,nt)=>{const d=new Date(ts);return DOW[(d.getDay()+6)%7]+' '+d.getDate()+'.'+p2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+(nt?'':' · '+hhmm(ts))};
function meetImport(list,title){const items=list.map(x=>Object.assign({on:!x.dup},x));

 ${groups.map(g=>`<div class="mimph">${avatarHTML(g.n,30)}<b>${esc(nodeTitle(g.n))}</b></div>`+g.l.map(x=>{const i=items.indexOf(x);return `<div class="mimp${x.on?'':' off'}" data-r="${i}"><i class="ck" data-ck="${i}">${x.on?'✓':''}</i><div class="mi1"><b>${fmtShortDT(x.ts,x.nt)}${x.dup?' · уже записана':''}</b><small>${esc(x.line)}</small></div><div class="mi2"><input class="inp" inputmode="decimal" data-am="${i}" value="${x.a||''}" placeholder="сумма"><select data-cu="${i}">${CURS.map(c=>`<option${c===x.c?' selected':''}>${c}</option>`).join('')}</select></div></div>`}).join('')).join('')}
 <div class="pmbar"><button class="btn pink wide" id="miok">Записать · ${cnt()}</button></div>`);
 const upd=()=>{el.querySelector('#miok').textContent='Записать · '+cnt()};
 el.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const x=items[+b.dataset.ck];x.on=!x.on;b.textContent=x.on?'✓':'';b.closest('.mimp').classList.toggle('off',!x.on);upd()});

 el.querySelector('#miok').onclick=async()=>{const ok=items.filter(x=>x.on);if(!ok.length){closeSheet();return}const by=new Map();
  for(const x of ok){const n=x.n;const m={id:uid(),rDone:0,rSnooze:0,ts:x.ts,amount:x.a>0?x.a:0,cur:x.c,rw:SET.remW||3,rh:SET.remH||4,rOn:true,src:'note'};if(x.nt)m.nt=1;snap(m);
   if(dueOf(m)<Date.now())m.rDone=Date.now();(n.meets=n.meets||[]).push(m);if(!by.has(n))by.set(n,[]);by.get(n).push(m)}
  for(const [n,ms] of by){await saveNode(n,false);onMeetSaved(n,ms)}dirty();closeSheet();render();
  let a=0,r=0;ok.forEach(x=>{if(x.a>0){a+=conv(x.a,x.c,'AED');r+=conv(x.a,x.c,'RUB')}});
  toast('Записала встреч: '+ok.length+(a>0?' · '+nf0.format(Math.round(a))+' AED':''))}}
/* hint after editing a note */
const NHS=new Set();
function noteHint(nt){if(!nt||!N.has(nt.id)||N.get(nt.id).deleted)return;const n=N.get(nt.parent);if(!n||!isLead(n))return;
 const f=scanLead(n).filter(x=>!x.dup&&x.note===nt.id&&!NHS.has(n.id+dkey(x.ts)));if(!f.length)return;f.forEach(x=>NHS.add(n.id+dkey(x.ts)));

const ymLabel=ym=>{if(ym[0]==='<')return 'До '+ym.slice(1);const a=ym.split('-').map(Number);return MN[a[1]-1]+(a[0]!==new Date().getFullYear()?' '+a[0]:'')};

/* ----- money ----- */
function rangeOf(b,c){if(c.ym&&c.ym[0]==='<')return{from:0,to:new Date(+c.ym.slice(1),0,1).getTime()-1};
 if(c.ym){const a=c.ym.split('-').map(Number);return{from:new Date(a[0],a[1]-1,1).getTime(),to:new Date(a[0],a[1],1).getTime()-1}}
 if(c.type==='met'&&!b.free&&b.from)return{from:sod(b.from)-864e5,to:eod(b.to)+864e5};return null}
const meetsIn=(n,r)=>meetsOf(n).filter(m=>m.amount>0&&m.ts>=r.from&&m.ts<=r.to);
function sumOf(list){const by={};let aed=0,rub=0;for(const m of list){by[m.cur]=(by[m.cur]||0)+m.amount;aed+=m.aed||conv(m.amount,m.cur,'AED');rub+=m.rub||conv(m.amount,m.cur,'RUB')}return{by,aed,rub}}
const onlyRub=by=>Object.keys(by).every(c=>c==='RUB');
const rubLine=s=>onlyRub(s.by)?'':`<small class="bmr">≈ ${nf0.format(Math.round(s.rub))} ₽</small>`;

function cardMeets(b,c,n,it,all){const r=rangeOf(b,c);if(!r)return null;const ms=meetsOf(n).filter(m=>(all||m.amount>0)&&m.ts>=r.from&&m.ts<=r.to).sort((x,y)=>x.ts-y.ts);
 const ii=c.items.indexOf(it);const same=[];c.items.forEach((x,i)=>{if(x.id===n.id)same.push(i)});const cnt=same.length,j=same.indexOf(ii);
 if(cnt<=1||j<0)return ms;return j<cnt-1?(ms[j]?[ms[j]]:[]):ms.slice(j)}
const uniqItems=c=>{const seen=new Set(),out=[];for(const it of liveItems(c)){if(seen.has(it.id))continue;seen.add(it.id);out.push(it)}return out};
function cardMoneyHTML(b,c,n,it){const r=rangeOf(b,c);if(!r)return '';const l=cardMeets(b,c,n,it);const ii=c.items.indexOf(it);
 if(l.length)return `<b class="bmn" data-act="bsum" data-id="${n.id}" data-cc="${c.id}" data-ii="${ii}">💰 ${byStr(sumOf(l).by)}${rubLine(sumOf(l))}</b>`;
 if(c.role==='met'||c.type==='met')return `<b class="bmn z" data-act="bsum" data-id="${n.id}" data-cc="${c.id}" data-ii="${ii}">＋ сумма</b>`;return ''}

 if(!all.length)return '';const s=sumOf(all);const multi=Object.keys(s.by).length>1||(!s.by.AED&&!onlyRub(s.by));
 return `<div class="bsum"><span>Итого</span><b>${byStr(s.by)}</b>${multi?`<small>≈ ${nf0.format(Math.round(s.aed))} AED</small>`:''}${rubLine(s)}</div>`}
function sumFromCard(b,n,cid,ii){loadRates();const c=b.cols.find(x=>x.id===cid)||{};const r=rangeOf(b,c);const day=c.ym&&c.ym[0]!=='<'&&c.ym!==ymOf(Date.now())?c.ym+'-01':dkey(Date.now());
 const it=c.items&&c.items[+ii]&&c.items[+ii].id===n.id?c.items[+ii]:(c.items||[]).find(x=>x.id===n.id);
 const list=r&&it?cardMeets(b,c,n,it,true):[];
 if(!list.length)return meetSheet(n,null,day);if(list.length===1)return meetSheet(n,list[0]);
 menuSheet('Встречи: '+nodeTitle(n),[...list.map(m=>({ic:'💰',t:fmtDate(m.ts)+(m.amount>0?' · '+nf0.format(Math.round(m.amount))+' '+(SYM[m.cur]||m.cur):''),sub:'изменить',fn:()=>meetSheet(n,m)})),{ic:'＋',t:'Новая встреча',fn:()=>meetSheet(n,null,day)}])}

function analyzeChat(txt,n){const T=txt.toLowerCase();const has=r=>r.test(T);
 const S={meet:/встрет|увидим|пересеч|приед|заед|созвон|свидани|when can we meet|let'?s meet|see you|are you free|свободн|давай увид/,

  later:/позже|потом|попозже|на следующей неделе|в следующий раз|как будет время|напишу сам|напишу позже|сейчас занят|не сейчас|через (неделю|месяц|пару)|после (поездки|праздн|командировк)/,
  no:/не интересно|неинтересно|не надо|не пиши|не беспокой|отстань|удали мой|stop writ|no thanks|not interested|ошиб(ся|лись|очка) номер/,
  price:/сколько стоит|какая цена|цена|прайс|стоимость|price|how much/};
 const tc=n.tc||0;const out={lines:[],acts:[],reply:''};
 if(!txt.trim()&&!tc){out.lines.push('Переписки нет. Вставь текст или скриншот, или посмотри данные ниже.');return out}
 if(has(S.no)){out.lines.push('🛑 Похоже на отказ. Лучше не писать дальше.');out.acts.push({t:'Поставить «Не писать»',fn:async()=>{n.st='stop';await saveNode(n,false);toast('Метка: Не писать')}})}
 else if(has(S.meet)&&has(S.when)){out.lines.push('🔥 Хочет встретиться и назвал время. Это тёплый лид: подтверди встречу и добавь на доску в «виделись» после встречи.');out.acts.push({t:'Поставить «Тёплый 🔥»',fn:async()=>{n.w='hot';await saveNode(n,false);toast('Теплота: Тёплый')}});out.reply='Отлично, договорились! Подтверждаю, увидимся 😊'}
 else if(has(S.meet)){out.lines.push('🔥 Хочет встретиться, но день пока не назвал. Предложи два конкретных варианта: так проще ответить «да».');out.acts.push({t:'Поставить «Тёплый 🔥»',fn:async()=>{n.w='hot';await saveNode(n,false);toast('Теплота: Тёплый')}});out.reply='Я могу в четверг вечером или в пятницу днём. Что тебе удобнее? 😊'}
 else if(has(S.later)){out.lines.push('⏳ Откладывает. Не дави: напиши через неделю.');out.acts.push({t:'Напомнить через 7 дней',fn:async()=>{n.plan=sod(Date.now())+7*864e5+18*36e5;if(!n.st||n.st==='never')n.st='some';await saveNode(n,false);toast('Напомню через неделю')}});out.reply='Хорошо, без проблем! Напишу тебе через недельку 😊'}
 else if(has(S.price)){out.lines.push('💬 Спрашивает цену. Ответь коротко и сразу предложи время, пока интерес горячий.')}
 else if(txt.trim())out.lines.push('🤔 Чёткого сигнала в тексте не вижу. Если последним писала ты — подожди 3 дня и напомни один раз.');
 if(tc>=3)out.lines.push('✉ Без ответа уже '+tc+' из '+sleepN()+' сообщений. Если дойдёт до '+sleepN()+' — лучше отложить на потом.');
 if(tc>=sleepN()-1)out.acts.push({t:'Поставить «Спящий»',fn:async()=>{n.st='sleep';await saveNode(n,false);toast('Метка: Спящий')}});
 if(n.lt)out.lines.push('Последний раз писала: '+relShort(n.lt)+'.');
 return out}

function thumbHTML(n,grid){
 if(isBook(n))return `<div class="th book">${coverHTML(n)}</div>`;
 if(n.type==='col'&&n.avatar)return `<div class="th"><img src="${bu(n.avatar)}" alt=""></div>`;
 if(n.type==='col'){const k=kids(n.id).filter(x=>x.type!=='col'||true).slice(0,4);if(!k.length)return `<div class="th empty" style="background:#eef3ff">🗂️</div>`;
  return `<div class="th"><div class="collage">${[0,1,2,3].map(i=>{const x=k[i];if(!x)return '<i></i>';if(x.type==='photo')return `<i><img src="${bu(x.thumb)}" alt=""></i>`;return `<i>${x.type==='col'?'🗂':'≡'}</i>`}).join('')}</div></div>`}

 const mk=n.mark?`<span class="mark">${esc(n.mark)}</span>`:'';const pin=n.pinned?'<span class="pinb">📌</span>':'';
 let sub;if(n.type==='col'){sub=subText(n);const sm=sumNode(n.id);if(sm.c&&isLead(n)){const lm=lastMeet(n);const add=(lm?'встреча '+fmtDate(lm):'')+(sm.aed>0?' · '+nf0.format(Math.round(sm.aed))+' AED':'');sub=sub==='Пусто'?add.replace(/^ · /,''):sub+' · '+add.replace(/^ · /,'')}if(n.parent&&isLead(n)){const pr=[n.w&&n.w!=='ok'?WE[n.w]:'',n.st?ST[n.st].t:''].filter(Boolean).join(' ');const pp=planOf(n);const parts=[pr,sub==='Пусто'?'':sub,pp&&pp.ts?'✉ '+fmtPlan(pp.ts).replace(/^.{2}, /,''):''].filter(Boolean);sub=parts.join(' · ')||'Пусто'}}else if(n.type==='photo')sub=fmtDate(n.updated);else{const f=plainOf(n).split('\n').map(s=>s.trim()).filter(Boolean);sub=fmtDate(n.updated)+(f[1]?' · '+f[1]:(f[0]&&!n.title?'':f[0]?' · '+f[0]:''))}

 else h+=`<div class="${vm==='grid'?'grid':'list'}">${items.map(x=>itemHTML(x,vm)).join('')}</div>`;

/* ===== crop screen ===== */
function cropScreen(o){return new Promise(res=>{
 const el=document.createElement('div');el.className='ovl';
 el.innerHTML=`<div class="cwrap"><div class="topbar"><button class="ib" id="cx">${ICON.close}</button><b style="font-size:17px">${esc(o.title||'')}</b><span style="width:46px"></span></div>
  ${o.allowFull?`<div class="seg"><button data-m="square">Квадрат</button><button data-m="full">Целиком</button></div>`:'<div style="height:12px"></div>'}
  <div id="cb"></div>${o.circle?'<div class="hint">Всё, что внутри круга, станет фото человека</div>':''}<div class="row" style="justify-content:center;margin-top:16px"><button class="btn pink" id="cok" style="min-width:200px">${o.last?'Готово':'Далее'}</button></div></div>`;
 document.body.appendChild(el);let mode=o.allowFull?(o.mode||'square'):'square',cr=null;
 const seg=()=>el.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 async function draw(){seg();const body=el.querySelector('#cb');
  if(mode==='square'){const W=Math.min(el.clientWidth-32,420),H=Math.round(W/(o.ar||1));
   body.innerHTML=`<div class="stage" id="stg" style="width:${W}px;height:${H}px"><img id="cim" src="${o.srcUrl}" alt="">${o.circle?'<div class="circ"></div>':'<div class="grid3"></div>'}</div><input type="range" id="zm" min="1" max="6" step="0.01" value="1"><div class="hint">Двигай фото пальцем, приближай двумя пальцами или ползунком</div>`;
   const im=body.querySelector('#cim');try{await im.decode()}catch(e){}cr=Cropper(body.querySelector('#stg'),im,(o.rect&&o.mode===mode)?o.rect:null);
   const zm=body.querySelector('#zm');zm.value=cr.zoom();zm.oninput=()=>cr.setZoom(+zm.value);cr.onZoom(z=>{zm.value=z})}
  else{cr=null;body.innerHTML=`<img class="fullimg" src="${o.srcUrl}" alt="" style="max-height:62vh"><div class="hint">Фото сохранится целиком, без обрезки. Подходит для скриншотов.</div>`}}
 el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
 const close=v=>{el.remove();res(v)};el.querySelector('#cx').onclick=()=>close(null);
 el.querySelector('#cok').onclick=()=>close({mode,rect:cr?cr.rect():null});draw()})}

/* ===== photos: add / recrop ===== */
async function addPhotos(files,parent){files=[...files];let added=0;
 for(let i=0;i<files.length;i++){let u=null;try{const s=await makeSrc(files[i]);const L=await loadImg(s.blob);u=L.u;
  const res=await cropScreen({srcUrl:u,title:files.length>1?`Фото ${i+1} из ${files.length}`:'Рамка фото',allowFull:true,mode:s.extreme?'full':(SET.lastMode||'square'),last:i===files.length-1});
  if(!res)break;SET.lastMode=res.mode;saveSet();const as=await buildAssets(L.im,res.mode,res.rect);
  const n=newNode('photo',parent,{mode:res.mode,crop:res.rect,w:s.w,h:s.h,thumb:as.thumb,src:'',view:''});n.src=n.id+'_s';await putBlob(n.src,s.blob);if(as.view){n.view=n.id+'_v';await putBlob(n.view,as.view)}await saveNode(n);added++}
  catch(e){console.error(e);toast('Не получилось загрузить одно из фото')}finally{if(u)URL.revokeObjectURL(u)}}
 render();if(added)toast(added+' '+plural(added,'фото добавлено','фото добавлено','фото добавлено'))}
async function recrop(n){const b=await getBlob(n.src);if(!b)return toast('Фото не найдено');const L=await loadImg(b);
 const res=await cropScreen({srcUrl:L.u,title:'Рамка фото',allowFull:true,mode:n.mode,rect:n.crop,last:true});
 if(res){const as=await buildAssets(L.im,res.mode,res.rect);n.mode=res.mode;n.crop=res.rect;n.thumb=as.thumb;if(as.view){n.view=n.id+'_v';await putBlob(n.view,as.view)}else if(n.view){await dbDel('blobs',n.view);n.view=''}await saveNode(n,false)}

function hl(text,toks){const t=nq(text);const rg=[];for(const k of toks){let i=0;while(k&&(i=t.indexOf(k,i))>=0){rg.push([i,i+k.length]);i+=k.length}}rg.sort((a,b)=>a[0]-b[0]);
 let out='',p=0;for(const [a,b] of rg){if(a<p)continue;out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b}return out+esc(text.slice(p))}

 ${sn?`<div class="row"><button class="pill c2" data-sc="here">В «${esc(nodeTitle(sn))}»</button><button class="pill ghost" data-sc="all">Везде</button></div>`:''}<div id="rs"></div></div>`;
 document.body.appendChild(el);const q=el.querySelector('#q'),rs=el.querySelector('#rs');setTimeout(()=>q.focus(),60);
 const sc=()=>el.querySelectorAll('[data-sc]').forEach(b=>{b.className='pill '+((b.dataset.sc==='all')===all?'c2':'ghost')});if(sn)sc();
 function run(){const raw=q.value.trim();if(!raw){rs.innerHTML='<div class="hint" style="margin-top:30px">Ищу по названиям, тексту заметок и подписям.<br>Телефон можно вводить в любом формате.</div>';return}
  const toks=nq(raw).split(/\s+/).filter(Boolean);const dg=raw.replace(/\D/g,'');const phone=dg.length>=4&&/^[\d\s+\-().]+$/.test(raw);const out=[];
  for(const n of N.values()){if(n.deleted)continue;if(!all&&n.id!==scope&&!isDesc(n.id,scope))continue;if(n.id===scope)continue;
   const title=nodeTitle(n),pl=(n.type==='note'?plainOf(n):(n.caption||'')+(n.dist?' '+Object.values(n.dist).join(' '):'')+(n.nuance?' '+n.nuance:'')+(n.chats?' '+n.chats.map(c=>c.text||'').join(' '):'')).replace(/\s+/g,' ');const hay=nq(title+' \n '+pl);
   let ok=toks.every(t=>hay.includes(t));let byPhone=false;if(!ok&&phone){ok=(title+' '+pl).replace(/\D/g,'').includes(dg);byPhone=ok}
   if(ok)out.push({n,title,pl,byPhone,tm:toks.every(t=>nq(title).includes(t))})}
  out.sort((a,b)=>(b.tm-a.tm)||b.n.updated-a.n.updated);
  rs.innerHTML=out.length?out.slice(0,100).map((r,i)=>{const path=pathOf(r.n.id).slice(0,-1).map(x=>nodeTitle(x)).join(' › ');let sn='';if(r.pl){const low=nq(r.pl);let at=-1;for(const t of toks){const k=low.indexOf(t);if(k>=0&&(at<0||k<at))at=k}const s=Math.max(0,(at<0?0:at)-30);sn=(s?'…':'')+hl(r.pl.slice(s,s+120),toks)}
   return `<button class="res" data-i="${i}"><div class="th ${r.n.type==='photo'&&r.n.mode==='full'?'full':''}${r.n.type==='note'?' noteic':''}" style="width:52px;height:52px;border-radius:14px">${r.n.type==='photo'?`<img src="${bu(r.n.thumb)}" alt="">`:r.n.type==='note'?ICON.note:'<div class="empty" style="padding:0;font-size:22px;height:52px;display:grid;place-items:center">'+(r.n.type==='task'?'✅':isBook(r.n)?'📘':'🗂️')+'</div>'}</div><div class="rt"><b>${hl(r.title,toks)}</b>${path?`<div class="path">${esc(path)}</div>`:''}${sn?`<div class="sn">${sn}</div>`:''}</div></button>`}).join(''):'<div class="hint" style="margin-top:30px">Ничего не нашлось</div>';
  rs.querySelectorAll('.res').forEach(b=>b.onclick=()=>{const n=out[+b.dataset.i].n;el.remove();go(routeOf(n))})}
 let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(run,120)};run();
 el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{all=b.dataset.sc==='all';sc();run()});el.querySelector('#sx').onclick=()=>el.remove()}
